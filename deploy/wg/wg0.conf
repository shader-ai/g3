# WireGuard server interface — gateway (EC2).
#
# This file is bind-mounted into the linuxserver/wireguard container at /config/wg_confs/wg0.conf
# (or /config/wg0.conf depending on the image version). The linuxserver image auto-applies it.
#
# Before deploying:
#   1. Generate a server private key: docker run --rm linuxserver/wireguard wg genkey
#   2. Replace FILL_WITH_SERVER_PRIVATE_KEY below with the generated key.
#   3. Derive the public key: echo <private_key> | docker run --rm -i linuxserver/wireguard wg pubkey
#   4. Set WG_GATEWAY_PUBKEY in backend/.env to the derived public key.
#
# Peers are managed dynamically by peer-sync (GET /tunnel/peers → wg syncconf).
# Do NOT add [Peer] sections here — peer-sync owns that.

[Interface]
# Inner IP of the gateway — clients' AllowedIPs default route resolves here.
# Must match TUNNEL_RESERVED_IPS in backend/.env (default: 10.66.0.1).
Address = 10.66.0.1/16
ListenPort = 51820
PrivateKey = FILL_WITH_SERVER_PRIVATE_KEY

# PostUp/PreDown: handled by gateway-net.sh run via `docker exec wireguard bash /config/gateway-net.sh`
# after `docker compose up -d`. Do not add nftables commands here; they need to run after
# the compose stack is fully up and the wg netns matches the g3proxy netns.

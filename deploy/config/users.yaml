# G3 Proxy user list (Basic auth)
# Format: array of users with "name" and "token".
# Token must be crypt(5) or xcrypt_hash (see below).
#
# Generate password hash (SHA-512, recommended):
#   openssl passwd -6 'your_password'
#
# Then use in token as xcrypt_hash:
#   - name: "your_username"
#     token:
#       type: xcrypt_hash
#       value: "$6$rounds=5000$saltsalt$..."  # output of openssl passwd -6
#
    # Example (password is "password" - change in production):
- name: "proxyuser"
  token:
    type: xcrypt_hash
    value: "$6$k3R.PEpbhOzhOzfm$GKZIlQau9qJ43YVVM.ntIyK6G.KUMUVb1QQuv8yl5xPuwlroCMwiBDsA8x8SmkvO7LgE1hXWvSUHmRZAqDJlJ/"
  audit:
    enable_protocol_inspection: true

- name: "rohan"
  token:
    type: xcrypt_hash
    value: "$6$6gJFESZtKkJ/vjWt$rW7WqF26GBu.aUc4Sm6hHW7MWTLfFxnzQFhQchaiE7G.lM84n7fuV9PCaXC8CtT/UgP7jkwB.8.wC1Qtv1b0D0"
  audit:
    enable_protocol_inspection: true

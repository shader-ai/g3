# G3 Proxy Configuration - Squid Replacement
# Reference: https://g3-project.readthedocs.io/projects/g3proxy/en/latest/

worker:
  thread_number: 4

# Optional: StatsD metrics (uncomment and set target to enable; run g3statsd or any StatsD for TSDB)
# stat:
#   target:
#     udp: 127.0.0.1:8125
#   prefix: g3proxy
#   emit_duration: 200ms

# Resolver (required for escaper)
resolver:
  - name: default
    type: c-ares

# Escaper (required for server - without this, traffic is denied)
escaper:
  - name: default
    type: direct_fixed
    resolver: default

# User group: Live LDAP bind against Samba AD DC.
# Any user in AD can authenticate — no static password files.
# G3 constructs the bind DN as: cn=<username>,<ldap_url base DN>
# and performs a live bind. Wrong password → 407, correct → traffic allowed.
# After a successful bind G3 fetches the configured AD attributes and injects
# them as X-Client-* headers so ICAPeg and URAI need zero LDAP credentials.
user_group:
  - name: default_users
    type: ldap
    ldap_url: "ldap://host.docker.internal:389/CN=Users,DC=gfoxai,DC=local"
    username_attribute: cn
    response_timeout: 10s
    extra_ldap_attrs:
      - mail
      - givenName
      - sn
    pool:
      min_idle_count: 1
    unmanaged_user:
      name: ad_user
      audit:
        enable_protocol_inspection: true

# Auditor: ICAP for AI governance.
# TLS interception (SSL bump) requires a certificate generator service (e.g. g3fcgen).
# Here we point to a tls_cert_agent at 127.0.0.1:2999 (default for g3fcgen).
# If you run g3proxy in Docker, make sure this address resolves to your g3fcgen service
# (for example by changing it to \"g3fcgen:2999\" and adding a g3fcgen container).
auditor:
  - name: ai_governance
    protocol_inspection: {}
    tls_cert_agent:
      # In Docker, resolve via service DNS. Prefix with '@' to enable runtime DNS resolution.
      # g3fcgen must listen on a non-loopback address for this to work.
      query_peer_addr: "@g3fcgen:2999"
      query_wait_timeout: 10s
    icap_reqmod_service:
      # deploy.sh replaces this with icap://${ICAP_IP}:${ICAP_PORT}/ from deploy.env
      url: "icap://host.docker.internal:1344/reqmod"
      disable_preview: true
      bypass: false
    # Optional: icap_respmod_service: "icap://host.docker.internal:1344/respmod"
    application_audit_ratio: 1.0

# HTTP proxy server
server:
  - name: main_proxy
    type: http_proxy
    escaper: default
    user_group: default_users
    auditor: ai_governance

    listen:
      address: 0.0.0.0:3128

    auth_realm: "AI Governance Proxy - Please authenticate"

    # Enable TLS interception for CONNECT requests
    tls_client: {}

    # Allowed destination ports
    dst_port_filter:
      - 21
      - 70
      - 80
      - 210
      - 280
      - 443
      - 488
      - 591
      - 777
      - 1025-65535

    req_header_recv_timeout: 30s
    rsp_header_recv_timeout: 60s

# Logging configuration
# - default/stdout: process logs (startup, errors, etc.)
# - task: logs each request when finished, including failures with reason
log:
  default: stdout
  task: stdout

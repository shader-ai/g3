# G3 Proxy — WireGuard gateway mode (tcp_tproxy + auditor)
#
# Spike S1/S2 confirmed: tcp_tproxy passes through the auditor TLS-bump + ICAP
# chain, and g3-icap-client emits X-Client-IP from the socket peer address —
# under TPROXY this is the original WireGuard inner IP, not the gateway IP.
#
# Traffic path: WireGuard client → nftables TPROXY → g3proxy tcp_tproxy
#   → auditor (TLS bump via g3fcgen) → ICAP reqmod (icapeg whois) → target.
#
# No user auth: identity is cryptographically bound to the WireGuard inner IP
# (resolved at ICAP time via /tunnel/whois).

worker:
  thread_number: 4

# Optional StatsD metrics
# stat:
#   target:
#     udp: 127.0.0.1:8125
#   prefix: g3proxy
#   emit_duration: 200ms

resolver:
  - name: default
    type: c-ares

escaper:
  - name: default
    type: direct_fixed
    resolver: default

auditor:
  - name: ai_governance
    protocol_inspection: {}
    tls_cert_agent:
      # g3fcgen shares the g3proxy network namespace so 127.0.0.1:2999 is correct.
      query_peer_addr: "127.0.0.1:2999"
      query_wait_timeout: 10s
    icap_reqmod_service:
      # deploy.sh substitutes ${ICAP_IP}:${ICAP_PORT} from deploy.env.
      url: "icap://host.docker.internal:1344/reqmod"
    application_audit_ratio: 1.0
    # Entra auth bypass (login.microsoftonline.com) is enforced upstream in
    # nftables-tproxy.sh via dest-IP `return` before the TPROXY mark, not in g3.
    # g3's TLS inspection has no per-SNI no-bump path: do_intercept calls
    # do_intercept_modern unconditionally (g3proxy/src/inspect/tls/modern.rs).

# Transparent proxy — no auth. TPROXY redirect from nftables sends WG inner
# traffic here. Client identity is resolved by icapeg via X-Client-IP (inner IP).
server:
  - name: tproxy
    type: tcp_tproxy
    escaper: default
    auditor: ai_governance
    listen:
      address: "127.0.0.1:3129"

log:
  default: stdout
  task: stdout

# Build from local g3 repo: context = parent of deploy/ (g3 repo root).
# Run from deploy/:  docker compose build && docker compose up -d
#
# Services:
#   wireguard  — kernel WireGuard, terminates VPN tunnels from macOS agents
#   g3proxy    — tcp_tproxy transparent proxy with TLS-bump + ICAP audit
#   g3fcgen    — TLS cert generator (shares g3proxy network namespace)
#   peer-sync  — polls GET /tunnel/peers; reconciles WG peers via wg syncconf
#   cert-pin-watcher — streams g3proxy logs, auto-bypasses cert-pinned hostnames
#
# icapeg runs separately on the host (see icapeg README); g3proxy reaches it
# via host.docker.internal:1344 (deploy.env ICAP_IP).

services:
  wireguard:
    image: ghcr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TZ=UTC
    volumes:
      - ./wg:/config:rw
      # gateway-net.sh and sync-azure-login-ips.sh are mounted read-only so
      # `docker exec wireguard bash /config/gateway-net.sh` works after compose up.
      - ./gateway-net.sh:/config/gateway-net.sh:ro
      - ./sync-azure-login-ips.sh:/config/sync-azure-login-ips.sh:ro
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  g3proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: g3proxy:local
    container_name: g3proxy
    restart: unless-stopped
    depends_on:
      - wireguard
    volumes:
      - ./logs:/var/log/g3proxy
      - ./config/g3proxy.yaml:/etc/g3proxy/g3proxy.yaml:ro
    environment:
      - RUST_LOG=info
      - TZ=UTC
    # TPROXY requires NET_ADMIN to bind transparent sockets.
    cap_add:
      - NET_ADMIN
    # Shares wireguard network namespace so TPROXY sees inner client IPs.
    network_mode: "service:wireguard"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  g3fcgen:
    build:
      context: ..
      dockerfile: deploy/g3fcgen.Dockerfile
    image: g3fcgen:local
    container_name: g3fcgen
    restart: unless-stopped
    volumes:
      - ./config/g3fcgen.yaml:/etc/g3fcgen/g3fcgen.yaml:ro
      - ./certs:/etc/g3fcgen/certs:ro
    command: ["-c", "/etc/g3fcgen/g3fcgen.yaml"]
    network_mode: "service:wireguard"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  peer-sync:
    build:
      context: ./peer-sync
    container_name: peer-sync
    restart: unless-stopped
    depends_on:
      - wireguard
    env_file: deploy.env
    environment:
      - URAI_BROKER_URL=${URAI_BROKER_URL}
      - URAI_GATEWAY_TOKEN=${URAI_GATEWAY_TOKEN}
      - WG_INTERFACE=wg0
      - PEER_SYNC_INTERVAL=${PEER_SYNC_INTERVAL:-5}
    cap_add:
      - NET_ADMIN
    # Shares wireguard namespace so `wg syncconf wg0 ...` works.
    network_mode: "service:wireguard"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cert-pin-watcher:
    build:
      context: .
      dockerfile: sidecar.Dockerfile
    image: cert-pin-watcher:local
    container_name: cert-pin-watcher
    restart: unless-stopped
    volumes:
      - ./config/g3proxy.yaml:/config/g3proxy.yaml:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - G3_CONFIG_PATH=/config/g3proxy.yaml
      - G3_CONTAINER=g3proxy
      - G3_AUDITOR=ai_governance
      - BACKEND_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - g3proxy
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
